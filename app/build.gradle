plugins { id 'com.android.application' }
android {
    namespace 'kr.co.namulsan.smartvisit'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.co.namulsan.smartvisit'
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '0.4.0-OVERLAY-MMS-EXPERIMENT'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// MMS PDU encoder only; archived upstream, trial use requires careful validation.
dependencies { implementation 'com.klinkerapps:android-smsmms:5.2.6' }
